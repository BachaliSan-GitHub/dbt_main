version: 2

models:
  - name: fact_claim
    description: "Fact table containing insurance claims"

    columns:

      - name: claim_id
        tests:
          - not_null
          - unique

      - name: claim_status
        tests:
          - accepted_values:
              arguments:
                values:
                  - Approved
                  - Denied
                  - Pending
                  - Under Review
              config:
                severity: warn

      - name: severity_tier
        tests:
          - accepted_values:
              arguments:
                values:
                  - Low
                  - Medium
                  - High
              config:
                severity: warn

      - name: policy_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_policies')
                field: policy_id