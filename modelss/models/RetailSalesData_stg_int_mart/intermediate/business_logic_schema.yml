version: 2

models:

  - name: int_sales_metrics
    description: "Final sales with calculations"

    columns:

      - name: sales_amount
        tests:
          - not_null

      - name: sales_band
        tests:
          - accepted_values:
              arguments: 
                values: ['high','low','low value']

      - name: sales_sk
        tests:
          - not_null
          - unique