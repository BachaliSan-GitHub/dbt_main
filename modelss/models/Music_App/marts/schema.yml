version: 2

models:
    - name: fct_music_summary
      description: 'music app fact info'
      columns:
          - name: STREAM_ID
            description: 'business id'
            data_type: NUMBER
            tests:
              - not_null

          - name: STREAM_SK
            description: 'unique surrogate key id'
            data_type: VARCHAR
            tests:
              - not_null
              - unique
                 
          - name : STATUS
            description: 'musicapp information'
            data_type: VARCHAR(100)
            tests:
              - accepted_values:
                 arguments:
                  values: ['song','podcast','ad','live_stream']

          - name: CREATED_DATE
            description: 'date info'
            data_type: TIMESTAMP_NTZ


          


